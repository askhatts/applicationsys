# РЕАЛЬНАЯ рабочая конфигурация на боевом сервере (oncomap-abai.kz).
#
# Изначально планировался отдельный поддомен requests.oncomap-abai.kz, но DNS-панель
# gohost.kz (WHMCS DNS Manager 2) не применяла новые записи к живым нейм-серверам —
# SOA serial зоны не менялся при сохранении (баг/особенность их бэкенда). Поэтому
# приложение подключено ПУТЁМ на уже работающем домене: https://oncomap-abai.kz/requests/
#
# Это заменяет ВЕСЬ site-блок {$SITE_DOMAIN} в /opt/onco/deploy/Caddyfile.
# handle_path гарантирует взаимоисключающую маршрутизацию: /requests* обслуживается
# без basic_auth нашим приложением, всё остальное — как раньше, за паролем.
# Заголовок X-Forwarded-Prefix нужен приложению (см. run_prod.py, PrefixMiddleware),
# чтобы Flask генерировал ссылки с префиксом /requests.

{$SITE_DOMAIN} {
	encode zstd gzip

	handle_path /requests* {
		reverse_proxy requests_app:8000 {
			header_up X-Forwarded-Prefix /requests
		}
	}

	handle {
		# Пароль на просмотр всего дашборда (basic auth).
		# Хеш: docker run --rm caddy:2-alpine caddy hash-password --plaintext 'ВАШ_ПАРОЛЬ'
		basic_auth {
			{$BASIC_AUTH_USER} {$BASIC_AUTH_HASH}
		}

		reverse_proxy backend:8000
	}

	header {
		X-Robots-Tag "noindex, nofollow"
		-Server
	}

	log {
		output file /data/access.log {
			roll_size 10mb
			roll_keep 5
		}
	}
}
