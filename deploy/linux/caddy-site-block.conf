# Блок для добавления в СУЩЕСТВУЮЩИЙ /opt/onco/deploy/Caddyfile (дописать в конец,
# НЕ трогая остальной файл — там уже настроен основной сайт oncomap-abai.kz).
# Использует общий блок `{ email ... }`, который уже объявлен в начале файла.

requests.oncomap-abai.kz {
	encode zstd gzip

	reverse_proxy requests_app:8000

	header {
		X-Robots-Tag "noindex, nofollow"
		-Server
	}

	log {
		output file /data/access-requests.log {
			roll_size 10mb
			roll_keep 5
		}
	}
}
