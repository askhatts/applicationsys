# /etc/nginx/sites-available/requests.oncomap-abai.kz
# После установки: ln -s ../sites-available/requests.oncomap-abai.kz /etc/nginx/sites-enabled/
# Certbot допишет сюда блок с 443/ssl автоматически (см. deploy/linux/setup_vps.sh).

server {
    listen 80;
    server_name requests.oncomap-abai.kz;

    client_max_body_size 2m;

    location /static/ {
        alias /opt/applicationsys/app/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
